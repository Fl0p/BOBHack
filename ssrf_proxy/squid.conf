# Squid configuration for SSRF protection in Dify
# This proxy helps protect against Server-Side Request Forgery attacks

# HTTP port
http_port 3128

# Allow connections from internal Docker network
acl localnet src 172.16.0.0/12    # Docker network range
acl localnet src 192.168.0.0/16   # Private network
acl localnet src 10.0.0.0/8       # Private network

# Safe SSL ports
acl SSL_ports port 443

# Safe ports
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 1025-65535  # unregistered ports

# HTTP methods
acl CONNECT method CONNECT

# Deny access to unsafe ports
http_access deny !Safe_ports

# Deny CONNECT to other than secure SSL ports
http_access deny CONNECT !SSL_ports

# Allow localhost and internal networks
http_access allow localhost
http_access allow localnet

# Block access to private IP ranges (prevent SSRF)
acl to_private_ips dst 10.0.0.0/8
acl to_private_ips dst 172.16.0.0/12
acl to_private_ips dst 192.168.0.0/16
acl to_private_ips dst fc00::/7
acl to_private_ips dst fe80::/10
acl to_private_ips dst 127.0.0.0/8
acl to_private_ips dst ::1

# Block access to localhost
acl to_localhost dst 127.0.0.1/32
acl to_localhost dst ::1

# Allow outbound connections (except to private IPs)
http_access deny to_private_ips
http_access deny to_localhost

# Allow everything else
http_access allow all

# Disable caching
cache deny all

# Logging
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Coredump directory
coredump_dir /var/spool/squid

# Refresh patterns
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320

# Disable via header
via off

# Disable forwarded_for
forwarded_for delete

# Timeout settings
connect_timeout 30 seconds
read_timeout 300 seconds
request_timeout 60 seconds

