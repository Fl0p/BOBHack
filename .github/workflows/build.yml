name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create .env file
      run: echo '${{ secrets.ENV_FILE }}' > .env
      
    - name: Create client_secret.json
      run: echo '${{ secrets.GOOGLE_CLIENT_SECRET }}' > client_secret.json
      
    - name: Create cloudflared directory
      run: mkdir -p .cloudflared
      
    - name: Create cloudflared credentials
      run: echo '${{ secrets.CLOUDFLARED_CREDENTIALS }}' > .cloudflared/f3ae1442-62b0-4c23-8808-46c7e22dff72.json
      
    - name: Make scripts executable
      run: chmod +x scripts/rebuild-and-start.sh
      
    - name: Run rebuild and start
      run: ./scripts/rebuild-and-start.sh
      
    - name: Check running containers
      run: docker-compose ps
      
    - name: Show logs
      if: failure()
      run: docker-compose logs

