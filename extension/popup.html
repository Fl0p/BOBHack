<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Form Filler Bot / BOOB Solution</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
        min-width: 240px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      input[type='text'],
      textarea {
        font-size: 13px;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      textarea {
        resize: vertical;
      }
      .manual-input-wrapper {
        display: block;
      }
      .manual-input-text {
        width: 100%;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #005fcc;
        background: #0b66ff;
        color: #fff;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #005fcc;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #run {
        flex: 1 1 auto;
      }
      .manual-mic-button {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .manual-mic-button svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 14px;
      }
      .hidden {
        display: none;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #444;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <div class="field" id="product-field">
        <label for="productId">Product ID</label>
        <input type="text" id="productId" name="productId" placeholder="Enter product ID" value="" />
      </div>

      <label class="checkbox">
        <input type="checkbox" id="manualToggle" name="manualToggle" />
        Manual Input
      </label>

      <div class="field hidden" id="manual-field">
        <label for="manualInput">Manual Input</label>
        <div class="manual-input-wrapper">
          <textarea
            id="manualInput"
            class="manual-input-text"
            name="manualInput"
            rows="4"
            placeholder="Paste manual payload"
          ></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="run" type="submit">Fill Form</button>
        <button
          id="manualMicButton"
          class="manual-mic-button"
          type="button"
          title="Voice Input"
          aria-label="Voice Input"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
            />
          </svg>
        </button>
      </div>
    </form>
    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
