services:
  # Frontend service (BOBHack)
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL}
    container_name: bobhack-frontend
    restart: unless-stopped
    networks:
      - bobhack-network

  # Backend service (BOBHack)
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: bobhack-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BACKEND_DB_HOST=backend-db
      - BACKEND_DB_PORT=5432
      - BACKEND_DB_USER=${BACKEND_DB_USER:-bobhack}
      - BACKEND_DB_PASSWORD=${BACKEND_DB_PASSWORD}
      - BACKEND_DB_NAME=${BACKEND_DB_NAME:-bobhack}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
    depends_on:
      backend-db:
        condition: service_healthy
    networks:
      - bobhack-network

  # Backend PostgreSQL database
  backend-db:
    image: postgres:15-alpine
    container_name: backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BACKEND_DB_USER:-bobhack}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
      POSTGRES_DB: ${BACKEND_DB_NAME:-bobhack}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
    volumes:
      - backend-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bobhack-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${BACKEND_DB_USER:-bobhack}", "-d", "${BACKEND_DB_NAME:-bobhack}"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Dify PostgreSQL database
  dify-db:
    image: postgres:15-alpine
    container_name: dify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dify}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    networks:
      - bobhack-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-dify}", "-d", "${DB_DATABASE:-dify}"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Dify Redis
  dify-redis:
    image: redis:6-alpine
    container_name: dify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-difyai123456}
    volumes:
      - dify-redis-data:/data
    networks:
      - bobhack-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-difyai123456} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dify API service
  dify-api:
    image: langgenius/dify-api:1.9.2
    container_name: dify-api
    restart: unless-stopped
    environment:
      # Mode
      MODE: api
      
      # URLs
      CONSOLE_API_URL: ${DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL}
      SERVICE_API_URL: ${DIFY_URL}
      APP_API_URL: ${DIFY_URL}
      APP_WEB_URL: ${DIFY_URL}
      FILES_URL: ${DIFY_URL}
      
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dify}
      SQLALCHEMY_POOL_SIZE: 30
      SQLALCHEMY_MAX_OVERFLOW: 10
      SQLALCHEMY_POOL_RECYCLE: 3600
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      REDIS_USE_SSL: "false"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/api/storage
      
      # Security
      SECRET_KEY: ${DIFY_SECRET_KEY}
      
      # Migration
      MIGRATION_ENABLED: ${DIFY_MIGRATION_ENABLED:-true}
      
      # CORS
      CONSOLE_CORS_ALLOW_ORIGINS: ${DIFY_URL}
      WEB_API_CORS_ALLOW_ORIGINS: '*'
      
      # Session & Cookies
      SESSION_TYPE: redis
      SESSION_PERMANENT: "true"
      SESSION_USE_SIGNER: "true"
      PERMANENT_SESSION_LIFETIME: 86400
      COOKIE_HTTPONLY: "true"
      COOKIE_SAMESITE: Lax
      COOKIE_SECURE: "true"
      
      # Proxy settings for Cloudflare Tunnel
      PREFERRED_URL_SCHEME: https
      RESPECT_XFORWARD_HEADERS_ENABLED: "true"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
      FLASK_DEBUG: "false"
      
      # Code Execution (Sandbox)
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      CODE_MAX_NUMBER: 9223372036854775807
      CODE_MIN_NUMBER: -9223372036854775808
      CODE_MAX_STRING_LENGTH: 400000
      
      # Marketplace & Plugins
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      POSITION_TOOL_PINS: ${POSITION_TOOL_PINS:-}
      
      # Plugin settings
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      PLUGIN_DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT}
      
      # Vector Store (default: Weaviate)
      VECTOR_STORE: ${VECTOR_STORE:-weaviate}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT:-http://weaviate:8080}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      
      # Other settings
      DEPLOY_ENV: PRODUCTION
      DIFY_BIND_ADDRESS: 0.0.0.0
      DIFY_PORT: 5001
      SERVER_WORKER_AMOUNT: 1
      SERVER_WORKER_CLASS: gevent
      GUNICORN_TIMEOUT: 360
      
    volumes:
      - dify-api-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
      - bobhack-network
      - ssrf_proxy_network

  # Dify Worker
  dify-worker:
    image: langgenius/dify-api:1.9.2
    container_name: dify-worker
    restart: unless-stopped
    environment:
      # Mode
      MODE: worker
      
      # URLs
      CONSOLE_API_URL: ${DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL}
      SERVICE_API_URL: ${DIFY_URL}
      APP_API_URL: ${DIFY_URL}
      APP_WEB_URL: ${DIFY_URL}
      FILES_URL: ${DIFY_URL}
      
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dify}
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/api/storage
      
      # Security
      SECRET_KEY: ${DIFY_SECRET_KEY}
      
      # Code Execution
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      
      # Plugin settings
      PLUGIN_DIFY_INNER_API_URL: http://dify-api:5001
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT}
      
      # Vector Store
      VECTOR_STORE: ${VECTOR_STORE:-weaviate}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT:-http://weaviate:8080}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      
      # Celery settings
      CELERY_WORKER_CLASS: ${CELERY_WORKER_CLASS:-}
      CELERY_WORKER_AMOUNT: ${CELERY_WORKER_AMOUNT:-}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
      
    volumes:
      - dify-api-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
      - bobhack-network
      - ssrf_proxy_network

  # Dify Worker Beat (Celery Beat for scheduling)
  dify-worker-beat:
    image: langgenius/dify-api:1.9.2
    container_name: dify-worker-beat
    restart: unless-stopped
    environment:
      MODE: beat
      
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dify}
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/api/storage
      OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
      OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
      
      # Security
      SECRET_KEY: ${DIFY_SECRET_KEY}
      
      # Vector Store
      VECTOR_STORE: ${VECTOR_STORE:-weaviate}
      
    volumes:
      - dify-api-storage:/app/api/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_started
    networks:
      - bobhack-network
      - ssrf_proxy_network

  # Dify Web (Console)
  dify-web:
    image: langgenius/dify-web:1.9.2
    container_name: dify-web
    restart: unless-stopped
    environment:
      EDITION: SELF_HOSTED
      CONSOLE_API_URL: ${DIFY_URL}
      APP_API_URL: ${DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
    depends_on:
      - dify-api
    networks:
      - bobhack-network

  # DifySandbox - Required for code execution
  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    container_name: dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: 8194
    volumes:
      - ./volumes/sandbox/dependencies:/dependencies
      - ./volumes/sandbox/conf:/conf
    networks:
      - ssrf_proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SSRF Proxy - Security layer for external requests
  ssrf_proxy:
    image: ubuntu/squid:latest
    container_name: ssrf-proxy
    restart: unless-stopped
    environment:
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      REVERSE_PROXY_PORT: 8194
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: 8194
    volumes:
      - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - ssrf_proxy_network
      - bobhack-network

  # Plugin Daemon - Required for plugin system
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.3.3-local
    container_name: dify-plugin-daemon
    restart: unless-stopped
    environment:
      # Database
      DB_USERNAME: ${DB_USERNAME:-dify}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@dify-redis:6379/1
      
      # Server settings
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT}
      
      # Dify API connection
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
      
      # Plugin remote installing (REQUIRED)
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      
      # Plugin settings
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PPROF_ENABLED: ${PLUGIN_PPROF_ENABLED:-false}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-false}
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STDIO_BUFFER_SIZE: ${PLUGIN_STDIO_BUFFER_SIZE:-1024}
      PLUGIN_STDIO_MAX_BUFFER_SIZE: ${PLUGIN_STDIO_MAX_BUFFER_SIZE:-5242880}
      
      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
      OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Python mirror (optional)
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
      
    ports:
      - "${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    volumes:
      - ./volumes/plugin_daemon:/app/storage
    depends_on:
      dify-db:
        condition: service_healthy
    networks:
      - bobhack-network

  # Weaviate vector store (Optional, can be enabled with: docker-compose --profile weaviate up)
  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: weaviate
    profiles:
      - weaviate
    restart: unless-stopped
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
    networks:
      - bobhack-network

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yaml run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    networks:
      - bobhack-network
    depends_on:
      - frontend
      - backend
      - dify-web
      - dify-api

networks:
  bobhack-network:
    driver: bridge
  ssrf_proxy_network:
    driver: bridge
    internal: true

volumes:
  backend-db-data:
  dify-db-data:
  dify-redis-data:
  dify-api-storage:
  weaviate-data:

