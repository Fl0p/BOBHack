services:
  # Frontend service
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL}
    container_name: bobhack-frontend
    restart: unless-stopped
    networks:
      - bobhack-network

  # Backend service
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: bobhack-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - bobhack-network

  # Dify PostgreSQL database
  dify-db:
    image: postgres:15-alpine
    container_name: dify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD}
      POSTGRES_DB: dify
    volumes:
      - dify-db-data:/var/lib/postgresql/data
    networks:
      - bobhack-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dify Redis
  dify-redis:
    image: redis:7-alpine
    container_name: dify-redis
    restart: unless-stopped
    volumes:
      - dify-redis-data:/data
    networks:
      - bobhack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dify API service
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    restart: unless-stopped
    environment:
      # Mode
      MODE: api
      # DISABLE MARKETPLACE & PLUGINS
      MARKETPLACE_ENABLED: "false"
      # URLs (all on same domain now)
      CONSOLE_API_URL: ${DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL}
      SERVICE_API_URL: ${DIFY_URL}
      APP_API_URL: ${DIFY_URL}
      APP_WEB_URL: ${DIFY_URL}
      FILES_URL: ${DIFY_URL}
      
      # Database
      DB_USERNAME: dify
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: dify
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ''
      
      # Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage
      
      # Security
      SECRET_KEY: ${DIFY_SECRET_KEY}
      
      # Migration
      MIGRATION_ENABLED: ${DIFY_MIGRATION_ENABLED}
      
      # CORS (same domain, no CORS issues)
      CONSOLE_CORS_ALLOW_ORIGINS: ${DIFY_URL}
      WEB_API_CORS_ALLOW_ORIGINS: '*'
      
      # Session & Cookies
      SESSION_TYPE: redis
      SESSION_PERMANENT: true
      SESSION_USE_SIGNER: true
      PERMANENT_SESSION_LIFETIME: 86400
      COOKIE_HTTPONLY: true
      COOKIE_SAMESITE: Lax
      COOKIE_SECURE: true
      
      # Proxy settings for Cloudflare Tunnel
      PREFERRED_URL_SCHEME: https
      HTTP_X_FORWARDED_FOR: 1
      HTTP_X_FORWARDED_PROTO: 1
      HTTP_X_FORWARDED_HOST: ${DIFY_HOST}
      
      # Logging
      LOG_LEVEL: INFO
      DEBUG: false
      FLASK_DEBUG: false
    volumes:
      - dify-api-storage:/app/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    networks:
      - bobhack-network

  # Dify Worker
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    restart: unless-stopped
    environment:
      # Mode
      MODE: worker
      
      # Database
      DB_USERNAME: dify
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: dify-db
      DB_PORT: 5432
      DB_DATABASE: dify
      
      # Redis
      REDIS_HOST: dify-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage
      
      # Security
      SECRET_KEY: ${DIFY_SECRET_KEY}
    volumes:
      - dify-api-storage:/app/storage
    depends_on:
      dify-db:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    networks:
      - bobhack-network

  # Dify Web (Console)
  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    restart: unless-stopped
    environment:
      EDITION: SELF_HOSTED
      CONSOLE_API_URL: ${DIFY_URL}
      APP_API_URL: ${DIFY_URL}
      CONSOLE_WEB_URL: ${DIFY_URL}
    depends_on:
      - dify-api
    networks:
      - bobhack-network

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yaml run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    networks:
      - bobhack-network
    depends_on:
      - frontend
      - backend
      - dify-web
      - dify-api

networks:
  bobhack-network:
    driver: bridge

volumes:
  dify-db-data:
  dify-redis-data:
  dify-api-storage:

